name: GST-9700 Auto Sync Patch

on:
  push:
    branches: [main]
    paths:
      - 'src/components/WeighbridgeModule.tsx'
      - 'src/utils/GST9700AutoSyncEngine.ts'
      - 'scripts/patch-gst9700-autosync.py'
      - '.github/workflows/gst9700-autosync-patch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply GST-9700 Auto Sync integration
        run: python3 scripts/patch-gst9700-autosync.py

      - name: Commit integrated module
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/WeighbridgeModule.tsx
          if git diff --cached --quiet; then
            echo "No module changes required."
            exit 0
          fi
          git commit -m "feat: integrate GST-9700 auto sync engine"
          git push origin HEAD:main
